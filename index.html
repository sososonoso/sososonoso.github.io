<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sososonoso</title>
    <meta name="description" content="sososonoso のアプリ開発ページ" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #f7faf8;
        --surface: #ffffff;
        --text: #17211b;
        --muted: #5b675f;
        --primary: #00834d;
        --border: #dce7df;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0b0f0d;
          --surface: #141b17;
          --text: #edf5ef;
          --muted: #a9b6ad;
          --primary: #73e39e;
          --border: #26342b;
        }
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.7;
      }

      main {
        box-sizing: border-box;
        max-width: 800px;
        margin: 0 auto;
        padding: 56px 20px;
      }

      article {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 8px 0 0;
      }

      a {
        color: var(--primary);
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>sososonoso</h1>
        <p class="muted">個人開発アプリのサポートページです。</p>
        <p>
          <a href="https://sososonoso.github.io/repnobi-privacy/">
            レプノビ - 前回を超える筋トレ記録 プライバシーポリシー
          </a>
        </p>
        <p>
          <a href="https://sososonoso.github.io/nomurhythm-privacy/">
            のむリズム - 飲酒量と純アルコール量を記録するアプリ プライバシーポリシー
          </a>
        </p>
      </article>
    </main>
  </body>
</html>
